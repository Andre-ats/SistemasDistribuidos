
x-server-base: &server-base
  build:
    context: .
    dockerfile: Dockerfile.server
  restart: unless-stopped
  depends_on:
    - proxy
    - broker
    - referencia

x-client-base: &client-base
  build:
    context: .
    dockerfile: Dockerfile.client
  restart: unless-stopped

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    ports:
      - "5557:5557"
      - "5558:5558"

  broker:
    build:
      context: .
      dockerfile: Dockerfile.broker
    restart: unless-stopped
    ports:
      - "5555:5555"

  referencia:
    build:
      context: .
      dockerfile: Dockerfile.referencia
    restart: unless-stopped
    environment:
      REFERENCIA_PORT: "5559"
      HEARTBEAT_TIMEOUT: "30"

  server1:
    <<: *server-base
    environment:
      SERVER_ID: server1
      SERVER_PORT: "6000"
      PUB_PORT: "6001"
      PROXY_HOST: proxy
      DATA_DIR: /data
      REFERENCIA_HOST: referencia
      BROKER_HOST: broker
      REFERENCIA_PORT: "5559"
    ports:
      - "6000:6000"
      - "6001:6001"
    volumes:
      - server1_data:/data

  server2:
    <<: *server-base
    environment:
      SERVER_ID: server2
      SERVER_PORT: "7000"
      PUB_PORT: "7001"
      PROXY_HOST: proxy
      DATA_DIR: /data
      REFERENCIA_HOST: referencia
      BROKER_HOST: broker
      REFERENCIA_PORT: "5559"
    ports:
      - "7000:7000"
      - "7001:7001"
    volumes:
      - server2_data:/data

  server3:
    <<: *server-base
    environment:
      SERVER_ID: server3
      SERVER_PORT: "8000"
      PUB_PORT: "8001"
      PROXY_HOST: proxy
      DATA_DIR: /data
      REFERENCIA_HOST: referencia
      BROKER_HOST: broker
      REFERENCIA_PORT: "5559"
      CLOCK_DRIFT_MS: "3000"
    volumes:
      - server3_data:/data

  server4:
    <<: *server-base
    environment:
      SERVER_ID: server4
      SERVER_PORT: "8100"
      PUB_PORT: "8101"
      PROXY_HOST: proxy
      DATA_DIR: /data
      REFERENCIA_HOST: referencia
      BROKER_HOST: broker
      REFERENCIA_PORT: "5559"
    volumes:
      - server4_data:/data

  server5:
    <<: *server-base
    environment:
      SERVER_ID: server5
      SERVER_PORT: "8200"
      PUB_PORT: "8201"
      PROXY_HOST: proxy
      DATA_DIR: /data
      REFERENCIA_HOST: referencia
      BROKER_HOST: broker
      REFERENCIA_PORT: "5559"
      CLOCK_DRIFT_MS: "-2500"
    volumes:
      - server5_data:/data

  server6:
    <<: *server-base
    environment:
      SERVER_ID: server6
      SERVER_PORT: "8300"
      PUB_PORT: "8301"
      PROXY_HOST: proxy
      DATA_DIR: /data
      REFERENCIA_HOST: referencia
      BROKER_HOST: broker
      REFERENCIA_PORT: "5559"
    volumes:
      - server6_data:/data

  server7:
    <<: *server-base
    environment:
      SERVER_ID: server7
      SERVER_PORT: "8400"
      PUB_PORT: "8401"
      PROXY_HOST: proxy
      DATA_DIR: /data
      REFERENCIA_HOST: referencia
      BROKER_HOST: broker
      REFERENCIA_PORT: "5559"
      CLOCK_DRIFT_MS: "5000"
    volumes:
      - server7_data:/data

  server8:
    <<: *server-base
    environment:
      SERVER_ID: server8
      SERVER_PORT: "8500"
      PUB_PORT: "8501"
      PROXY_HOST: proxy
      DATA_DIR: /data
      REFERENCIA_HOST: referencia
      BROKER_HOST: broker
      REFERENCIA_PORT: "5559"
    volumes:
      - server8_data:/data

  client1:
    <<: *client-base
    environment:
      SERVER_HOST: broker
      SERVER_PORT: "5555"
      PUB_PORT: "6001"
      PROXY_HOST: proxy
      CLIENT_MODE: auto
      CLIENT_USER: cliente1
      CLIENT_CHANNEL: canal_cliente1
    depends_on:
      - proxy
      - broker

  client2:
    <<: *client-base
    environment:
      SERVER_HOST: broker
      SERVER_PORT: "5555"
      PUB_PORT: "7001"
      PROXY_HOST: proxy
      CLIENT_MODE: auto
      CLIENT_USER: cliente2
      CLIENT_CHANNEL: canal_cliente2
    depends_on:
      - proxy
      - broker

  client3:
    <<: *client-base
    environment:
      SERVER_HOST: broker
      SERVER_PORT: "5555"
      PUB_PORT: "8001"
      PROXY_HOST: proxy
      CLIENT_MODE: auto
      CLIENT_USER: cliente3
      CLIENT_CHANNEL: canal_cliente3
    depends_on:
      - proxy
      - broker

  client4:
    <<: *client-base
    environment:
      SERVER_HOST: broker
      SERVER_PORT: "5555"
      PUB_PORT: "8101"
      PROXY_HOST: proxy
      CLIENT_MODE: auto
      CLIENT_USER: cliente4
      CLIENT_CHANNEL: canal_cliente4
    depends_on:
      - proxy
      - broker

  client5:
    <<: *client-base
    environment:
      SERVER_HOST: broker
      SERVER_PORT: "5555"
      PUB_PORT: "8201"
      PROXY_HOST: proxy
      CLIENT_MODE: auto
      CLIENT_USER: cliente5
      CLIENT_CHANNEL: canal_cliente5
    depends_on:
      - proxy
      - broker

  client6:
    <<: *client-base
    environment:
      SERVER_HOST: broker
      SERVER_PORT: "5555"
      PUB_PORT: "8301"
      PROXY_HOST: proxy
      CLIENT_MODE: auto
      CLIENT_USER: cliente6
      CLIENT_CHANNEL: canal_cliente6
    depends_on:
      - proxy
      - broker

  client7:
    <<: *client-base
    environment:
      SERVER_HOST: broker
      SERVER_PORT: "5555"
      PUB_PORT: "8401"
      PROXY_HOST: proxy
      CLIENT_MODE: auto
      CLIENT_USER: cliente7
      CLIENT_CHANNEL: canal_cliente7
    depends_on:
      - proxy
      - broker

  client8:
    <<: *client-base
    environment:
      SERVER_HOST: broker
      SERVER_PORT: "5555"
      PUB_PORT: "8501"
      PROXY_HOST: proxy
      CLIENT_MODE: auto
      CLIENT_USER: cliente8
      CLIENT_CHANNEL: canal_cliente8
    depends_on:
      - proxy
      - broker

volumes:
  server1_data:
  server2_data:
  server3_data:
  server4_data:
  server5_data:
  server6_data:
  server7_data:
  server8_data:
